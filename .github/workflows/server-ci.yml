name: ServerCI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  
jobs:
  hub-test:
    name: Test hub and server packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run hub test
        run: go test ./internal/network -run TestHubBroadcastSkipsSenderAndDeliversToOtherClient -count=1

      - name: Ensure server package builds
        run: go test ./cmd/server

  deploy-server:
    name: Build and deploy server
    runs-on: ubuntu-latest
    needs: hub-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build server binary
        run: |
          mkdir -p build
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o build/audio-streamer-server ./cmd/server

      - name: Upload binary to remote host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "build/audio-streamer-server"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Restart server service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            install -m 755 ${{ secrets.DEPLOY_PATH }}/build/audio-streamer-server ${{ secrets.DEPLOY_PATH }}/audio-streamer-server
            
            sudo systemctl restart "${{ secrets.SERVER_SERVICE_NAME }}"
            sudo systemctl status "${{ secrets.SERVER_SERVICE_NAME }}"
